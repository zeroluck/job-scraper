# .github/workflows/score_jobs.yml
name: Job Scorer

on:
  schedule:
    # Keep scoring outside the daytime publication/insights window.
    - cron: "37 2,5,8,23 * * *"
      timezone: "America/New_York"
  workflow_dispatch: # Allows manual triggering from the Actions tab
    inputs:
      qualification:
        description: "REAL bounded qualification writes; requires one canonical archetype"
        required: false
        type: boolean
        default: false
      qualification_archetype:
        description: "Required canonical lane for bounded qualification"
        required: false
        type: string
        default: ""
      jobs_per_run:
        description: "Number of jobs to score in this run (overrides JOBS_TO_SCORE_PER_RUN)"
        required: false
        default: "50"
        type: number
      archetype:
        description: "Optional single canonical lane; blank processes all enabled lanes"
        required: false
        default: ""
        type: string
      drain_backlog:
        description: "Run bounded repeated passes until queues empty or time budget is reached"
        required: false
        default: false
        type: boolean

concurrency:
  group: lane-scoring
  cancel-in-progress: false

jobs:
  score:
    env:
      JOB_DATA_API_URL: https://pgsql.jdb.l.cd
      JOB_DATA_API_TOKEN: ${{ secrets.JOB_DATA_API_TOKEN }}
      JOB_STORAGE_BACKEND: supabase
    runs-on: ubuntu-latest # Use a standard Linux runner
    timeout-minutes: 360

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4 # Checks out your code

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" # Specify your desired Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure private data API
        uses: ./.github/actions/configure-data-api

      - name: Run job scoring script
        env:
          WORKFLOW_QUALIFICATION: ${{ inputs.qualification }}
          QUALIFICATION_ARCHETYPE: ${{ inputs.qualification_archetype }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # LLM Configuration (set via Repository Variables / Secrets)
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GEMINI_FIRST_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          JOBS_TO_SCORE_PER_RUN: ${{ inputs.jobs_per_run || '50' }}
          JOB_SCORE_ARCHETYPE: ${{ inputs.archetype || '' }}
          JOB_SCORE_DRAIN_BACKLOG: ${{ inputs.drain_backlog || 'false' }}
        run: |
          if [[ "$WORKFLOW_QUALIFICATION" == "true" ]]; then
            python -m scripts.run_workflow_qualification --workflow score_jobs
          else
            python score_jobs.py # Execute the job scoring script
          fi

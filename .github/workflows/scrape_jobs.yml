name: Hourly Job Publication Pipeline

on:
  schedule:
    - cron: "23 0,9-21 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "LinkedIn posted-time lookback; use 96 for missed-run recovery"
        required: false
        default: "48"
        type: choice
        options: ["24", "48", "72", "96", "168"]
      archetype:
        description: "Optional single canonical lane for manual recovery; blank scrapes all enabled lanes"
        required: false
        default: ""
        type: string
      reset_linkedin_circuit:
        description: "Close an open circuit after verifying its trigger was a false positive"
        required: false
        default: false
        type: boolean

concurrency:
  group: linkedin-freehire-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    # Logical coverage resumes across runs; this execution has a strict budget
    # so the next hourly slot cannot be blocked by excess source volume.
    timeout-minutes: 40
    outputs:
      discovery_cycle_id: ${{ steps.scraper.outputs.discovery_cycle_id }}
      discovery_sequence: ${{ steps.scraper.outputs.discovery_sequence }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Configure manual LinkedIn recovery window
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          REQUESTED_LOOKBACK_HOURS: ${{ inputs.lookback_hours }}
        run: |
          echo "LINKEDIN_RECOVERY_LOOKBACK_HOURS=${REQUESTED_LOOKBACK_HOURS}" >> "$GITHUB_ENV"
          echo "Requested recovery lookback: ${REQUESTED_LOOKBACK_HOURS}h"
      - name: Reset verified false-positive LinkedIn circuit
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_linkedin_circuit }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          python -c "import supabase_utils;
          changed = supabase_utils.reset_linkedin_source_circuit(
          'github-actions:${{ github.run_id }}',
          'Verified false-positive challenge detector; reset for diagnostic retry');
          print(f'LinkedIn source circuit reset: {changed}');
          raise SystemExit(0 if changed else 1)"
      - name: Run scraper script
        id: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPE_ARCHETYPE: ${{ inputs.archetype || '' }}
          LINKEDIN_DISCOVERY_MODE: adaptive_queue
        run: python scraper.py

  freehire_compat:
    if: ${{ inputs.archetype == '' || inputs.archetype == null }}
    needs: scrape
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Incrementally classify Freehire compatibility
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GEMINI_FIRST_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FREEHIRE_CLASSIFY_PAGE_SIZE: "500"
          FREEHIRE_CLASSIFY_REQUEST_BUDGET: "10"
        run: python incremental_freehire_compat.py

  publication_gate:
    if: ${{ always() && (inputs.archetype == '' || inputs.archetype == null) }}
    needs: [scrape, freehire_compat]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scrape_watermark: ${{ steps.gate.outputs.scrape_watermark }}
      published: ${{ steps.gate.outputs.published }}
      generation: ${{ steps.gate.outputs.generation }}
      outcome: ${{ steps.gate.outputs.outcome }}
      requested_cycle_id: ${{ steps.gate.outputs.requested_cycle_id }}
      eligible_cycle_id: ${{ steps.gate.outputs.eligible_cycle_id }}
      blocking_count: ${{ steps.gate.outputs.blocking_count }}
      published_at: ${{ steps.gate.outputs.published_at }}
      blocking_details: ${{ steps.gate.outputs.blocking_details }}
      row_count: ${{ steps.gate.outputs.row_count }}
      schema_version: ${{ steps.gate.outputs.schema_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused gate dependencies
        run: pip install python-dotenv supabase
      - name: Verify and finalize source publication
        id: gate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          python publication_gate.py
          --scrape-result "${{ needs.scrape.result }}"
          --freehire-compat-result "${{ needs.freehire_compat.result }}"
          --discovery-cycle-id "${{ needs.scrape.outputs.discovery_cycle_id }}"

  gate_watchdog:
    # Warn, don't discard: a deferred gate freezes the watermark and every
    # later run is a no-op until a human reviews the blocking tasks. File (or
    # refresh) a tracking issue so the stall pages a person instead of only
    # appearing in hourly logs nobody reads. Closes itself once publishing
    # resumes. The failing requirement rows stay untouched in the database;
    # unblocking remains a reviewed accept_linkedin_discovery_requirement call.
    if: ${{ always() && (inputs.archetype == '' || inputs.archetype == null) }}
    needs: [publication_gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: File or refresh gate-stall issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATE_OUTCOME: ${{ needs.publication_gate.outputs.outcome }}
          GATE_BLOCKING_COUNT: ${{ needs.publication_gate.outputs.blocking_count }}
          GATE_CYCLE_ID: ${{ needs.publication_gate.outputs.requested_cycle_id }}
          GATE_BLOCKING_DETAILS: ${{ needs.publication_gate.outputs.blocking_details }}
          GATE_GENERATION: ${{ needs.publication_gate.outputs.generation }}
        run: |
          if [ -z "$GATE_OUTCOME" ]; then
            echo "Gate did not report an outcome; watchdog idle."
            exit 0
          fi
          gh label create pipeline-gate \
            --repo "${{ github.repository }}" \
            --description "Deferred publication gate blocking ingestion watermark" \
            --color B60205 2>/dev/null || true
          OPEN_ISSUE=$(gh issue list --repo "${{ github.repository }}" --label pipeline-gate --state open --json number --jq '.[0].number // empty')
          RUN_LINK="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$GATE_OUTCOME" = "deferred" ] && [ "${GATE_BLOCKING_COUNT:-1}" != "0" ]; then
            BODY="Publication gate deferred on run <$RUN_LINK>."
            BODY="$BODY Cycle: \`$GATE_CYCLE_ID\`. Blocking: \`$GATE_BLOCKING_COUNT\`."
            BODY="$BODY Details: \`$GATE_BLOCKING_DETAILS\`."
            BODY="$BODY The watermark is frozen; hourly runs are no-ops until the blocking requirements are reviewed."
            BODY="$BODY Unblock with a reviewed accept_linkedin_discovery_requirement call (see the gate step summary for the exact statement)."
            if [ -z "$OPEN_ISSUE" ]; then
              gh issue create --repo "${{ github.repository }}" --label pipeline-gate \
                --title "Publication gate deferred: cycle $GATE_CYCLE_ID blocked" \
                --body "$BODY"
            else
              gh issue comment --repo "${{ github.repository }}" "$OPEN_ISSUE" --body "Still deferred on run <$RUN_LINK>. $BODY"
            fi
          elif [ "$GATE_OUTCOME" = "published" ] || [ "$GATE_OUTCOME" = "unchanged" ]; then
            if [ -n "$OPEN_ISSUE" ]; then
              gh issue comment --repo "${{ github.repository }}" "$OPEN_ISSUE" --body "Gate $GATE_OUTCOME (generation \`$GATE_GENERATION\`) on run <$RUN_LINK>; closing."
              gh issue close --repo "${{ github.repository }}" "$OPEN_ISSUE"
            else
              echo "Gate $GATE_OUTCOME; no open stall issue."
            fi
          else
            echo "Gate outcome $GATE_OUTCOME needs no watchdog action."
          fi

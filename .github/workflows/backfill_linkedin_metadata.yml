name: Backfill LinkedIn Metadata

on:
  workflow_dispatch:
    inputs:
      qualification:
        description: "REAL bounded qualification writes; requires one canonical archetype"
        required: false
        type: boolean
        default: false
      qualification_archetype:
        description: "Required canonical lane for bounded qualification"
        required: false
        type: string
        default: ""
      limit:
        description: "Maximum LinkedIn detail pages to check"
        required: false
        default: "500"
      apply:
        description: "Persist recovered metadata"
        required: false
        default: "false"

concurrency:
  group: linkedin-freehire-pipeline
  cancel-in-progress: false

jobs:
  backfill:
    env:
      JOB_DATA_API_URL: https://pgsql.jdb.l.cd
      JOB_DATA_API_TOKEN: ${{ secrets.JOB_DATA_API_TOKEN }}
      JOB_STORAGE_BACKEND: supabase
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Configure private data API
        uses: ./.github/actions/configure-data-api

      - name: Backfill available LinkedIn detail metadata
        env:
          WORKFLOW_QUALIFICATION: ${{ inputs.qualification }}
          QUALIFICATION_ARCHETYPE: ${{ inputs.qualification_archetype }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [[ "$WORKFLOW_QUALIFICATION" == "true" ]]; then
            python -m scripts.run_workflow_qualification --workflow backfill_linkedin_metadata
          else
            python backfill_linkedin_metadata.py --limit "${{ inputs.limit }}" ${{ inputs.apply == 'true' && '--apply' || '' }}
          fi

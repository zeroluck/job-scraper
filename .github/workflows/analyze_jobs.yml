name: Analyze Job Insights

on:
  workflow_run:
    workflows: ["Hourly Job Publication Pipeline"]
    types: [completed]
  workflow_dispatch:
    inputs:
      qualification:
        description: "REAL bounded qualification writes; requires one canonical archetype"
        required: false
        type: boolean
        default: false
      qualification_archetype:
        description: "Required canonical lane for bounded qualification"
        required: false
        type: string
        default: ""
      archetype:
        description: "Archetype to analyze insights for"
        required: false
        default: ""
      drain_backlog:
        description: "Continue processing until no unanalyzed jobs remain"
        required: false
        default: "false"
      replacement_backfill:
        description: "Reanalyze previously analyzed jobs once"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  analyze:
    env:
      JOB_DATA_API_URL: https://pgsql.jdb.l.cd
      JOB_DATA_API_TOKEN: ${{ secrets.JOB_DATA_API_TOKEN }}
      JOB_STORAGE_BACKEND: supabase
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'schedule') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: linkedin-job-insights-analysis
      cancel-in-progress: false

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure private data API
        uses: ./.github/actions/configure-data-api

      - name: Run job insights analysis
        env:
          WORKFLOW_QUALIFICATION: ${{ inputs.qualification }}
          QUALIFICATION_ARCHETYPE: ${{ inputs.qualification_archetype }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GEMINI_FIRST_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          JOB_INSIGHTS_ARCHETYPE: ${{ github.event.inputs.archetype || '' }}
          JOB_INSIGHTS_BACKFILL_ALL: ${{ github.event.inputs.drain_backlog || 'false' }}
          JOB_INSIGHTS_REPLACEMENT_BACKFILL: ${{ github.event.inputs.replacement_backfill || 'false' }}
        run: |
          if [[ "$WORKFLOW_QUALIFICATION" == "true" ]]; then
            python -m scripts.run_workflow_qualification --workflow analyze_jobs
          else
            python analyze_jobs.py
          fi

name: Resume Customization

on:
  workflow_dispatch:
    inputs:
      qualification:
        description: "REAL bounded qualification writes; requires one canonical archetype"
        required: false
        type: boolean
        default: false
      qualification_archetype:
        description: "Required canonical lane for bounded qualification"
        required: false
        type: string
        default: ""
      archetype:
        description: "Optional single canonical lane; blank processes all enabled lanes"
        required: false
        default: ""
        type: string

concurrency:
  group: lane-resume-generation
  cancel-in-progress: false

jobs:
  customize_resumes:
    env:
      JOB_DATA_API_URL: https://pgsql.jdb.l.cd
      JOB_DATA_API_TOKEN: ${{ secrets.JOB_DATA_API_TOKEN }}
      JOB_STORAGE_BACKEND: supabase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt not found. If your script has dependencies, please create this file."
          fi

      - name: Configure private data API
        uses: ./.github/actions/configure-data-api

      - name: Run resume customization script
        env:
          WORKFLOW_QUALIFICATION: ${{ inputs.qualification }}
          QUALIFICATION_ARCHETYPE: ${{ inputs.qualification_archetype }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # LLM Configuration (set via Repository Variables / Secrets)
          LLM_API_KEY: ${{ secrets.LLM_API_KEY || secrets.GEMINI_FIRST_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          JOB_RESUME_ARCHETYPE: ${{ inputs.archetype || '' }}
        run: |
          if [[ "$WORKFLOW_QUALIFICATION" == "true" ]]; then
            python -m scripts.run_workflow_qualification --workflow hourly_resume_customization
          else
            python custom_resume_generator.py
          fi

# .github/workflows/job_manager.yml
name: Daily Job Manager

on:
  schedule:
    # Runs every day at 17:00 UTC (1:00 AM SGT the next day)
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      qualification:
        description: "REAL bounded expiry and activity writes to two explicit rows"
        type: boolean
        default: false
      qualification_archetype:
        description: "Canonical lane; verify row membership independently"
        type: string
        default: ""
      qualification_expiry_job_id:
        description: "Reviewed eligible expiry canonical job ID"
        type: string
        default: ""
      qualification_activity_job_id:
        description: "Distinct reviewed eligible activity canonical job ID"
        type: string
        default: ""

concurrency:
  group: linkedin-freehire-pipeline
  cancel-in-progress: false

jobs:
  manage:
    env:
      JOB_DATA_API_URL: https://pgsql.jdb.l.cd
      JOB_DATA_API_TOKEN: ${{ secrets.JOB_DATA_API_TOKEN }}
      JOB_STORAGE_BACKEND: supabase
    runs-on: ubuntu-latest # Use a standard Linux runner

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4 # Checks out your code

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" # Specify your desired Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Ensure requirements.txt includes httpx if not already added
          pip install -r requirements.txt

      - name: Configure private data API
        uses: ./.github/actions/configure-data-api

      - name: Run job manager script
        env:
          # Define environment variables needed by your script
          # These should be set as Secrets in your GitHub repository settings
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Add other secrets if job_manager.py needs them (e.g., proxies if used differently)
          WORKFLOW_QUALIFICATION: ${{ inputs.qualification }}
          QUALIFICATION_ARCHETYPE: ${{ inputs.qualification_archetype }}
          QUALIFICATION_EXPIRY_JOB_ID: ${{ inputs.qualification_expiry_job_id }}
          QUALIFICATION_ACTIVITY_JOB_ID: ${{ inputs.qualification_activity_job_id }}
        run: |
          if [[ "$WORKFLOW_QUALIFICATION" == "true" ]]; then
            python -m scripts.run_workflow_qualification --workflow job_manager
          else
            python job_manager.py
          fi
